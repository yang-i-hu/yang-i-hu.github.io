# a summary about you
summary: "Currently a founding engineer at an AI startup in Brooklyn. I designed the agent orchestration,
which routes each request to a deterministic workflow, semantic retrieval, or full agent reasoning
based on intent, conversation state, and confidence.
<br/><br/>
Before this, I was a quant research intern at a quant fund, training high-frequency deep learning models.
At Unity, I helped ship Muse Chat, Unity's first AI agent.
<br/><br/>
As an undergrad, I did computer vision research on instance segmentation and super-resolution.
<br/><br/>
M.S. in Computer Science, NYU (2026). B.S. in Mathematics and Statistics & Data Science, UC Santa Barbara.
"

